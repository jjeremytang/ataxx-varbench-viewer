<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATAXX-VarBench 對局查詢</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc}.app{max-width:1180px;margin:auto;padding:22px}h1{margin:0 0 6px;font-size:28px}.muted{color:#94a3b8}.query{display:grid;grid-template-columns:1.3fr .7fr .7fr auto;gap:10px;margin:20px 0;padding:16px;background:#1e293b;border:1px solid #334155;border-radius:14px}.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:6px}input,button{width:100%;border:1px solid #475569;border-radius:10px;padding:11px 12px;font-size:16px;background:#0f172a;color:#fff}button{cursor:pointer;background:#2563eb;border-color:#2563eb;font-weight:600}.layout{display:grid;grid-template-columns:minmax(300px,700px) minmax(270px,1fr);gap:22px;align-items:start}.board-wrap,.panel{background:#1e293b;border:1px solid #334155;border-radius:16px}.board-wrap{padding:14px}#board{display:grid;gap:3px;width:100%;aspect-ratio:1}.cell{display:grid;place-items:center;border-radius:5px;background:#cbd5e1;min-width:0;min-height:0}.cell.blocked{background:#334155}.piece{width:70%;height:70%;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 2px 5px rgba(0,0,0,.35)}.piece.red{background:#ef4444}.piece.blue{background:#3b82f6}.panel{padding:18px}.meta{margin-bottom:14px;line-height:1.6}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.stat,.move-box{background:#0f172a;border-radius:10px;padding:12px}.stat span{display:block;color:#94a3b8;font-size:12px;margin-bottom:4px}.stat strong{font-size:18px}.move-box{min-height:78px;margin-bottom:16px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.controls button,.seed-nav button{background:#334155;border-color:#334155}.controls button.primary{background:#2563eb;border-color:#2563eb}.controls button:disabled{opacity:.4;cursor:default}input[type="range"]{padding:0;border:0;background:transparent}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#cbd5e1;font-size:13px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}.dot.red{background:#ef4444}.dot.blue{background:#3b82f6}.square{width:12px;height:12px;display:inline-block;margin-right:5px;background:#334155;vertical-align:-1px}.seed-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.error{color:#fca5a5;margin-top:10px;min-height:20px}@media(max-width:800px){.query{grid-template-columns:1fr 1fr}.query .go{grid-column:1/-1}.layout{grid-template-columns:1fr}.app{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <h1>ATAXX-VarBench 對局查詢</h1>
  <div class="muted">輸入任意 seed，直接重建 Random（紅）vs Greedy（藍）的完整對局。</div>
  <form class="query" id="queryForm">
    <div class="field"><label for="seedInput">Seed</label><input id="seedInput" inputmode="numeric" value="20260822"></div>
    <div class="field"><label for="sizeInput">棋盤大小</label><input id="sizeInput" type="number" min="4" max="30" value="10"></div>
    <div class="field"><label for="densityInput">障礙比例 %</label><input id="densityInput" type="number" min="0" max="90" step="1" value="15"></div>
    <div class="go field"><label>&nbsp;</label><button type="submit">調閱對局</button></div>
  </form>
  <div class="error" id="error"></div>
  <div class="layout">
    <div>
      <div class="board-wrap"><div id="board" aria-label="Ataxx 棋盤"></div></div>
      <div class="legend"><span><i class="dot red"></i>Random / Red</span><span><i class="dot blue"></i>Greedy / Blue</span><span><i class="square"></i>障礙</span></div>
    </div>
    <aside class="panel">
      <div class="meta" id="meta"></div>
      <div class="stat-grid"><div class="stat"><span>回合</span><strong id="turn">0</strong></div><div class="stat"><span>進度</span><strong id="progressText">0 / 0</strong></div><div class="stat"><span>紅方棋子</span><strong id="redScore">0</strong></div><div class="stat"><span>藍方棋子</span><strong id="blueScore">0</strong></div></div>
      <div class="move-box"><div class="muted" id="actor">開局</div><strong id="move">Initial position</strong></div>
      <div class="controls"><button id="prev" type="button">上一手</button><button id="play" class="primary" type="button">播放</button><button id="next" type="button">下一手</button></div>
      <label for="timeline">對局進度</label><input id="timeline" type="range" min="0" value="0" step="1">
      <label for="speed">播放速度：<span id="speedText">1×</span></label><input id="speed" type="range" min="0.25" max="4" value="1" step="0.25">
      <div class="muted" style="margin-top:14px" id="result"></div>
      <div class="seed-nav"><button type="button" id="prevSeed">上一個 seed</button><button type="button" id="nextSeed">下一個 seed</button></div>
    </aside>
  </div>
</div>
<script>
class MT19937_64{constructor(seed){this.N=312;this.M=156;this.A=0xB5026F5AA96619E9n;this.UM=0xFFFFFFFF80000000n;this.LM=0x7FFFFFFFn;this.mt=new Array(this.N).fill(0n);this.mti=this.N+1;this.seed(BigInt.asUintN(64,seed))}seed(seed){this.mt[0]=seed;for(this.mti=1;this.mti<this.N;this.mti++){const x=this.mt[this.mti-1]^(this.mt[this.mti-1]>>62n);this.mt[this.mti]=BigInt.asUintN(64,6364136223846793005n*x+BigInt(this.mti))}}next(){let x;const mag=[0n,this.A];if(this.mti>=this.N){let i=0;for(;i<this.N-this.M;i++){x=(this.mt[i]&this.UM)|(this.mt[i+1]&this.LM);this.mt[i]=this.mt[i+this.M]^(x>>1n)^mag[Number(x&1n)]}for(;i<this.N-1;i++){x=(this.mt[i]&this.UM)|(this.mt[i+1]&this.LM);this.mt[i]=this.mt[i+(this.M-this.N)]^(x>>1n)^mag[Number(x&1n)]}x=(this.mt[this.N-1]&this.UM)|(this.mt[0]&this.LM);this.mt[this.N-1]=this.mt[this.M-1]^(x>>1n)^mag[Number(x&1n)];this.mti=0}x=this.mt[this.mti++];x^=(x>>29n)&0x5555555555555555n;x^=(x<<17n)&0x71D67FFFEDA60000n;x^=(x<<37n)&0xFFF7EEE000000000n;x^=x>>43n;return BigInt.asUintN(64,x)}}
const key=(r,c)=>`${r},${c}`,inBounds=(r,c,n)=>r>=0&&r<n&&c>=0&&c<n,starts=n=>[[0,0],[n-1,n-1],[0,n-1],[n-1,0]];
function findEscape(start,n,p){for(let d=1;d<=2;d++)for(let dr=-d;dr<=d;dr++)for(let dc=-d;dc<=d;dc++){if(Math.max(Math.abs(dr),Math.abs(dc))!==d)continue;const r=start[0]+dr,c=start[1]+dc;if(inBounds(r,c,n)&&!p.has(key(r,c)))return[r,c]}throw new Error('Board layout does not leave an initial legal move.')}
function deterministicShuffle(a,rng){for(let i=a.length;i>1;i--){const j=Number(rng.next()%BigInt(i));[a[i-1],a[j]]=[a[j],a[i-1]]}}
function generateLevel(n,density,seed){if(n<4)throw new Error('棋盤大小至少為 4。');if(density<0||density>1)throw new Error('障礙比例必須在 0% 到 100% 之間。');const p=new Set(starts(n).map(x=>key(...x)));for(const s of starts(n)){const e=findEscape(s,n,p);p.add(key(...e))}const visited=new Set(),orbits=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){const k1=key(r,c);if(visited.has(k1))continue;const rr=n-1-r,cc=n-1-c,k2=key(rr,cc);visited.add(k1);visited.add(k2);if(p.has(k1)||p.has(k2))continue;const o=[[r,c]];if(k1!==k2)o.push([rr,cc]);orbits.push(o)}const target=Math.min(Math.round(density*n*n),n*n-p.size),rng=new MT19937_64(seed);deterministicShuffle(orbits,rng);const blocked=[];for(const o of orbits)if(blocked.length+o.length<=target)blocked.push(...o);return blocked}
class Game{constructor(n,blocked){this.size=n;this.board=Array.from({length:n},()=>Array(n).fill('.'));this.player='R';this.passes=0;this.moves=0;for(const[r,c]of blocked)this.board[r][c]='#';this.board[0][0]='R';this.board[n-1][n-1]='R';this.board[0][n-1]='B';this.board[n-1][0]='B'}clone(){const g=Object.create(Game.prototype);g.size=this.size;g.board=this.board.map(r=>r.slice());g.player=this.player;g.passes=this.passes;g.moves=this.moves;return g}count(x){let n=0;for(const row of this.board)for(const v of row)if(v===x)n++;return n}terminal(){return this.count('R')===0||this.count('B')===0||this.count('.')===0||this.passes>=2}legal(){if(this.terminal())return[];const out=[];for(let r=0;r<this.size;r++)for(let c=0;c<this.size;c++)if(this.board[r][c]===this.player)for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const d=Math.max(Math.abs(dr),Math.abs(dc));if(d===0||d>2)continue;const nr=r+dr,nc=c+dc;if(inBounds(nr,nc,this.size)&&this.board[nr][nc]==='.')out.push({type:d===1?'Clone':'Jump',from:[r,c],to:[nr,nc]})}return out}apply(m){if(this.terminal())return false;if(m.type==='Pass'){if(this.legal().length)return false;this.passes++;this.moves++;this.player=this.player==='R'?'B':'R';return true}const[fr,fc]=m.from,[tr,tc]=m.to;if(!inBounds(fr,fc,this.size)||!inBounds(tr,tc,this.size)||this.board[fr][fc]!==this.player||this.board[tr][tc]!=='.')return false;const d=Math.max(Math.abs(fr-tr),Math.abs(fc-tc));if((d===1?'Clone':d===2?'Jump':'Invalid')!==m.type)return false;if(m.type==='Jump')this.board[fr][fc]='.';this.board[tr][tc]=this.player;const enemy=this.player==='R'?'B':'R';for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=tr+dr,c=tc+dc;if(inBounds(r,c,this.size)&&this.board[r][c]===enemy)this.board[r][c]=this.player}this.passes=0;this.moves++;this.player=enemy;return true}encode(){return this.board.map(r=>r.join('')).join('')}}
const moveText=m=>m.type==='Pass'?'Pass':`${m.type} (${m.from[0]},${m.from[1]}) → (${m.to[0]},${m.to[1]})`;
function chooseGreedy(game){const moves=game.legal();if(!moves.length)return{type:'Pass'};const own=game.player;let best=moves[0],bestScore=-1;for(const m of moves){const next=game.clone();next.apply(m);const score=next.count(own);if(score>bestScore){bestScore=score;best=m}}return best}
function simulate(n,density,seed){const blocked=generateLevel(n,density,seed),game=new Game(n,blocked),rng=new MT19937_64(BigInt.asUintN(64,seed+1000000n));const frames=[{turn:0,player:'Start',agent:'-',move:'Initial position',board:game.encode(),red:2,blue:2}];let turn=1;while(!game.terminal()&&turn<=5000){const player=game.player,moves=game.legal();let chosen,agent;if(player==='R'){agent='Random';chosen=moves.length?moves[Number(rng.next()%BigInt(moves.length))]:{type:'Pass'}}else{agent='Greedy';chosen=chooseGreedy(game)}if(!game.apply(chosen))throw new Error('Agent produced an illegal move.');frames.push({turn,player:player==='R'?'Red':'Blue',agent,move:moveText(chosen),board:game.encode(),red:game.count('R'),blue:game.count('B')});turn++}if(!game.terminal())throw new Error('Match exceeded 5000 turns.');const red=game.count('R'),blue=game.count('B');return{frames,winner:red===blue?'Draw':red>blue?'Red':'Blue',blocked:blocked.length}}
const $=id=>document.getElementById(id),board=$('board'),seedInput=$('seedInput'),sizeInput=$('sizeInput'),densityInput=$('densityInput'),queryForm=$('queryForm'),errorEl=$('error'),meta=$('meta'),turnEl=$('turn'),progressText=$('progressText'),redScore=$('redScore'),blueScore=$('blueScore'),actor=$('actor'),moveEl=$('move'),prev=$('prev'),play=$('play'),next=$('next'),timeline=$('timeline'),speed=$('speed'),speedText=$('speedText'),result=$('result'),prevSeed=$('prevSeed'),nextSeed=$('nextSeed');let data=null,index=0,timer=null,currentSeed=0n;
function stop(){if(timer!==null){clearInterval(timer);timer=null}play.textContent='播放'}
function renderBoard(text,n){board.replaceChildren();board.style.gridTemplateColumns=`repeat(${n},1fr)`;for(const v of text){const cell=document.createElement('div');cell.className=v==='#'?'cell blocked':'cell';if(v==='R'||v==='B'){const piece=document.createElement('div');piece.className=`piece ${v==='R'?'red':'blue'}`;cell.appendChild(piece)}board.appendChild(cell)}}
function render(){if(!data)return;const f=data.frames[index];renderBoard(f.board,data.size);turnEl.textContent=f.turn;progressText.textContent=`${index} / ${data.frames.length-1}`;redScore.textContent=f.red;blueScore.textContent=f.blue;actor.textContent=f.turn===0?'開局':`${f.player} · ${f.agent}`;moveEl.textContent=f.move;timeline.value=index;prev.disabled=index===0;next.disabled=index===data.frames.length-1}
function start(){if(!data)return;if(index>=data.frames.length-1){index=0;render()}stop();const delay=Math.max(120,Math.round(900/Number(speed.value)));timer=setInterval(()=>{if(index>=data.frames.length-1){stop();return}index++;render()},delay);play.textContent='暫停'}
function load(seedText,sizeText,densityText,pushUrl=true){stop();errorEl.textContent='';try{const seed=BigInt(seedText);if(seed<0n||seed>18446744073709551615n)throw new Error('Seed 必須是 0 到 18446744073709551615 的整數。');const size=Number(sizeText),densityPercent=Number(densityText);if(!Number.isInteger(size)||size<4||size>30)throw new Error('棋盤大小請輸入 4 到 30 的整數。');if(!Number.isFinite(densityPercent)||densityPercent<0||densityPercent>90)throw new Error('障礙比例請輸入 0 到 90。');currentSeed=seed;const density=densityPercent/100,sim=simulate(size,density,seed);data={...sim,size,density,seed};index=0;timeline.max=data.frames.length-1;meta.textContent=`${size}×${size} · 障礙 ${densityPercent}% (${sim.blocked} 格) · seed ${seed}`;result.textContent=`結果：${sim.winner==='Draw'?'平手':sim.winner+' 獲勝'} · 共 ${data.frames.length-1} 回合`;render();if(pushUrl){const q=new URLSearchParams({seed:String(seed),size:String(size),density:String(densityPercent)});history.replaceState(null,'',`?${q}`)}}catch(e){errorEl.textContent=e.message}}
queryForm.addEventListener('submit',e=>{e.preventDefault();load(seedInput.value,sizeInput.value,densityInput.value)});prev.addEventListener('click',()=>{stop();if(index>0)index--;render()});next.addEventListener('click',()=>{stop();if(index<data.frames.length-1)index++;render()});play.addEventListener('click',()=>timer===null?start():stop());timeline.addEventListener('input',()=>{stop();index=Number(timeline.value);render()});speed.addEventListener('input',()=>{speedText.textContent=`${Number(speed.value).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}×`;if(timer!==null)start()});prevSeed.addEventListener('click',()=>{if(currentSeed>0n){seedInput.value=String(currentSeed-1n);load(seedInput.value,sizeInput.value,densityInput.value)}});nextSeed.addEventListener('click',()=>{if(currentSeed<18446744073709551615n){seedInput.value=String(currentSeed+1n);load(seedInput.value,sizeInput.value,densityInput.value)}});
const params=new URLSearchParams(location.search);if(params.has('seed'))seedInput.value=params.get('seed');if(params.has('size'))sizeInput.value=params.get('size');if(params.has('density'))densityInput.value=params.get('density');load(seedInput.value,sizeInput.value,densityInput.value,false);
</script>
</body>
</html>
