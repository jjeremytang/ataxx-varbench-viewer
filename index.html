<script>
class MT19937_64 {
  constructor(seed) {
    this.N = 312;
    this.M = 156;
    this.A = 0xB5026F5AA96619E9n;
    this.UM = 0xFFFFFFFF80000000n;
    this.LM = 0x7FFFFFFFn;
    this.mt = new Array(this.N).fill(0n);
    this.mti = this.N + 1;
    this.seed(BigInt.asUintN(64, seed));
  }

  seed(seed) {
    this.mt[0] = seed;
    for (this.mti = 1; this.mti < this.N; this.mti++) {
      const x = this.mt[this.mti - 1] ^ (this.mt[this.mti - 1] >> 62n);
      this.mt[this.mti] = BigInt.asUintN(
        64,
        6364136223846793005n * x + BigInt(this.mti)
      );
    }
  }

  next() {
    let x;
    const mag = [0n, this.A];
    if (this.mti >= this.N) {
      let i = 0;
      for (; i < this.N - this.M; i++) {
        x = (this.mt[i] & this.UM) | (this.mt[i + 1] & this.LM);
        this.mt[i] = this.mt[i + this.M] ^ (x >> 1n) ^ mag[Number(x & 1n)];
      }
      for (; i < this.N - 1; i++) {
        x = (this.mt[i] & this.UM) | (this.mt[i + 1] & this.LM);
        this.mt[i] = this.mt[i + (this.M - this.N)] ^ (x >> 1n) ^ mag[Number(x & 1n)];
      }
      x = (this.mt[this.N - 1] & this.UM) | (this.mt[0] & this.LM);
      this.mt[this.N - 1] = this.mt[this.M - 1] ^ (x >> 1n) ^ mag[Number(x & 1n)];
      this.mti = 0;
    }

    x = this.mt[this.mti++];
    x ^= (x >> 29n) & 0x5555555555555555n;
    x ^= (x << 17n) & 0x71D67FFFEDA60000n;
    x ^= (x << 37n) & 0xFFF7EEE000000000n;
    x ^= x >> 43n;
    return BigInt.asUintN(64, x);
  }
}

const key = (r, c) => `${r},${c}`;
const inBounds = (r, c, n) => r >= 0 && r < n && c >= 0 && c < n;
const starts = n => [[0, 0], [n - 1, n - 1], [0, n - 1], [n - 1, 0]];

function findEscape(start, n, protectedSet) {
  for (let d = 1; d <= 2; d++) {
    for (let dr = -d; dr <= d; dr++) {
      for (let dc = -d; dc <= d; dc++) {
        if (Math.max(Math.abs(dr), Math.abs(dc)) !== d) continue;
        const r = start[0] + dr;
        const c = start[1] + dc;
        if (inBounds(r, c, n) && !protectedSet.has(key(r, c))) return [r, c];
      }
    }
  }
  throw new Error('Board layout does not leave an initial legal move.');
}

function deterministicShuffle(values, rng) {
  for (let i = values.length; i > 1; i--) {
    const j = Number(rng.next() % BigInt(i));
    [values[i - 1], values[j]] = [values[j], values[i - 1]];
  }
}

function generateLevel(n, density, seed) {
  if (n < 4) throw new Error('棋盤大小至少為 4。');
  if (density < 0 || density > 1) throw new Error('障礙比例必須在 0% 到 100% 之間。');

  const protectedSet = new Set(starts(n).map(p => key(...p)));
  for (const start of starts(n)) {
    const escape = findEscape(start, n, protectedSet);
    protectedSet.add(key(...escape));
  }

  const visited = new Set();
  const orbits = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const firstKey = key(r, c);
      if (visited.has(firstKey)) continue;

      const rr = n - 1 - r;
      const cc = n - 1 - c;
      const secondKey = key(rr, cc);
      visited.add(firstKey);
      visited.add(secondKey);

      if (protectedSet.has(firstKey) || protectedSet.has(secondKey)) continue;

      const orbit = [[r, c]];
      if (firstKey !== secondKey) orbit.push([rr, cc]);
      orbits.push(orbit);
    }
  }

  const target = Math.min(Math.round(density * n * n), n * n - protectedSet.size);
  const rng = new MT19937_64(seed);
  deterministicShuffle(orbits, rng);

  const blocked = [];
  for (const orbit of orbits) {
    if (blocked.length + orbit.length <= target) blocked.push(...orbit);
  }
  return blocked;
}

class Game {
  constructor(n, blocked) {
    this.size = n;
    this.board = Array.from({length: n}, () => Array(n).fill('.'));
    this.player = 'R';
    this.passes = 0;
    this.moves = 0;

    for (const [r, c] of blocked) this.board[r][c] = '#';
    this.board[0][0] = 'R';
    this.board[n - 1][n - 1] = 'R';
    this.board[0][n - 1] = 'B';
    this.board[n - 1][0] = 'B';
  }

  clone() {
    const next = Object.create(Game.prototype);
    next.size = this.size;
    next.board = this.board.map(row => row.slice());
    next.player = this.player;
    next.passes = this.passes;
    next.moves = this.moves;
    return next;
  }

  count(cell) {
    let total = 0;
    for (const row of this.board) {
      for (const value of row) {
        if (value === cell) total++;
      }
    }
    return total;
  }

  terminal() {
    return this.count('R') === 0
      || this.count('B') === 0
      || this.count('.') === 0
      || this.passes >= 2;
  }

  winner() {
    if (!this.terminal()) return null;
    const red = this.count('R');
    const blue = this.count('B');
    if (red === blue) return null;
    return red > blue ? 'R' : 'B';
  }

  legal() {
    if (this.terminal()) return [];
    const moves = [];

    for (let r = 0; r < this.size; r++) {
      for (let c = 0; c < this.size; c++) {
        if (this.board[r][c] !== this.player) continue;

        for (let dr = -2; dr <= 2; dr++) {
          for (let dc = -2; dc <= 2; dc++) {
            const distance = Math.max(Math.abs(dr), Math.abs(dc));
            if (distance === 0 || distance > 2) continue;

            const nr = r + dr;
            const nc = c + dc;
            if (!inBounds(nr, nc, this.size) || this.board[nr][nc] !== '.') continue;

            moves.push({
              type: distance === 1 ? 'Clone' : 'Jump',
              from: [r, c],
              to: [nr, nc]
            });
          }
        }
      }
    }
    return moves;
  }

  apply(move) {
    if (this.terminal()) return false;

    if (move.type === 'Pass') {
      if (this.legal().length !== 0) return false;
      this.passes++;
      this.moves++;
      this.player = this.player === 'R' ? 'B' : 'R';
      return true;
    }

    const [fr, fc] = move.from;
    const [tr, tc] = move.to;
    if (!inBounds(fr, fc, this.size) || !inBounds(tr, tc, this.size)) return false;
    if (this.board[fr][fc] !== this.player || this.board[tr][tc] !== '.') return false;

    const distance = Math.max(Math.abs(fr - tr), Math.abs(fc - tc));
    const expected = distance === 1 ? 'Clone' : distance === 2 ? 'Jump' : 'Invalid';
    if (expected !== move.type) return false;

    if (move.type === 'Jump') this.board[fr][fc] = '.';
    this.board[tr][tc] = this.player;

    const enemy = this.player === 'R' ? 'B' : 'R';
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const r = tr + dr;
        const c = tc + dc;
        if (inBounds(r, c, this.size) && this.board[r][c] === enemy) {
          this.board[r][c] = this.player;
        }
      }
    }

    this.passes = 0;
    this.moves++;
    this.player = enemy;
    return true;
  }

  encode() {
    return this.board.map(row => row.join('')).join('');
  }
}

function moveText(move) {
  return move.type === 'Pass'
    ? 'Pass'
    : `${move.type} (${move.from[0]},${move.from[1]}) → (${move.to[0]},${move.to[1]})`;
}

function chooseGreedy(game) {
  const moves = game.legal();
  if (moves.length === 0) return {type: 'Pass'};

  const own = game.player;
  let bestMove = moves[0];
  let bestScore = Number.NEGATIVE_INFINITY;

  for (const move of moves) {
    const next = game.clone();
    next.apply(move);
    const score = next.count(own);
    if (score > bestScore) {
      bestScore = score;
      bestMove = move;
    }
  }
  return bestMove;
}

function evaluateAlphaBeta(game, rootPlayer) {
  const enemy = rootPlayer === 'R' ? 'B' : 'R';
  const pieceDiff = game.count(rootPlayer) - game.count(enemy);

  if (game.terminal()) {
    const winner = game.winner();
    if (winner === null) return pieceDiff;
    return winner === rootPlayer
      ? 100000 + pieceDiff
      : -100000 + pieceDiff;
  }

  const mobility = game.legal().length;
  const signedMobility = game.player === rootPlayer ? mobility : -mobility;
  return pieceDiff * 10 + signedMobility;
}

function alphaBetaSearch(game, depth, alpha, beta, rootPlayer) {
  if (depth === 0 || game.terminal()) {
    return evaluateAlphaBeta(game, rootPlayer);
  }

  const moves = game.legal();
  if (moves.length === 0) {
    const next = game.clone();
    if (!next.apply({type: 'Pass'})) throw new Error('Alpha-Beta 無法套用必要的 Pass。');
    return alphaBetaSearch(next, depth - 1, alpha, beta, rootPlayer);
  }

  const maximizing = game.player === rootPlayer;
  if (maximizing) {
    let best = Number.NEGATIVE_INFINITY;
    for (const move of moves) {
      const next = game.clone();
      next.apply(move);
      best = Math.max(best, alphaBetaSearch(next, depth - 1, alpha, beta, rootPlayer));
      alpha = Math.max(alpha, best);
      if (alpha >= beta) break;
    }
    return best;
  }

  let best = Number.POSITIVE_INFINITY;
  for (const move of moves) {
    const next = game.clone();
    next.apply(move);
    best = Math.min(best, alphaBetaSearch(next, depth - 1, alpha, beta, rootPlayer));
    beta = Math.min(beta, best);
    if (alpha >= beta) break;
  }
  return best;
}

function chooseAlphaBeta(game, depth) {
  const moves = game.legal();
  if (moves.length === 0) return {type: 'Pass'};

  const rootPlayer = game.player;
  let bestScore = Number.NEGATIVE_INFINITY;
  let bestMove = moves[0];
  let alpha = Number.NEGATIVE_INFINITY;
  const beta = Number.POSITIVE_INFINITY;

  for (const move of moves) {
    const next = game.clone();
    next.apply(move);
    const score = alphaBetaSearch(next, depth - 1, alpha, beta, rootPlayer);
    if (score > bestScore) {
      bestScore = score;
      bestMove = move;
    }
    alpha = Math.max(alpha, bestScore);
  }
  return bestMove;
}

function agentLabel(config) {
  if (config.type === 'random') return 'Random';
  if (config.type === 'greedy') return 'Greedy';
  return `Alpha-Beta (d=${config.depth})`;
}

function chooseAgentMove(game, config, rng) {
  if (config.type === 'random') {
    const moves = game.legal();
    return moves.length
      ? moves[Number(rng.next() % BigInt(moves.length))]
      : {type: 'Pass'};
  }
  if (config.type === 'greedy') return chooseGreedy(game);
  return chooseAlphaBeta(game, config.depth);
}

function simulate(n, density, seed, redConfig, blueConfig) {
  const blocked = generateLevel(n, density, seed);
  const game = new Game(n, blocked);

  const redRng = new MT19937_64(BigInt.asUintN(64, seed + 1000000n));
  const blueRng = new MT19937_64(BigInt.asUintN(64, seed + 2000000n));
  const redName = agentLabel(redConfig);
  const blueName = agentLabel(blueConfig);

  const frames = [{
    turn: 0,
    player: 'Start',
    agent: '-',
    move: 'Initial position',
    board: game.encode(),
    red: 2,
    blue: 2
  }];

  let turn = 1;
  while (!game.terminal() && turn <= 5000) {
    const player = game.player;
    const config = player === 'R' ? redConfig : blueConfig;
    const rng = player === 'R' ? redRng : blueRng;
    const chosen = chooseAgentMove(game, config, rng);
    const name = player === 'R' ? redName : blueName;

    if (!game.apply(chosen)) throw new Error('Agent produced an illegal move.');

    frames.push({
      turn,
      player: player === 'R' ? 'Red' : 'Blue',
      agent: name,
      move: moveText(chosen),
      board: game.encode(),
      red: game.count('R'),
      blue: game.count('B')
    });
    turn++;
  }

  if (!game.terminal()) throw new Error('Match exceeded 5000 turns.');

  const red = game.count('R');
  const blue = game.count('B');
  return {
    frames,
    winner: red === blue ? 'Draw' : red > blue ? 'Red' : 'Blue',
    blocked: blocked.length,
    redName,
    blueName
  };
}

const $ = id => document.getElementById(id);
const board = $('board');
const seedInput = $('seedInput');
const sizeInput = $('sizeInput');
const densityInput = $('densityInput');
const redAgent = $('redAgent');
const blueAgent = $('blueAgent');
const redDepth = $('redDepth');
const blueDepth = $('blueDepth');
const redDepthField = $('redDepthField');
const blueDepthField = $('blueDepthField');
const queryForm = $('queryForm');
const statusEl = $('status');
const errorEl = $('error');
const matchup = $('matchup');
const meta = $('meta');
const turnEl = $('turn');
const progressText = $('progressText');
const redScore = $('redScore');
const blueScore = $('blueScore');
const actor = $('actor');
const moveEl = $('move');
const prev = $('prev');
const play = $('play');
const next = $('next');
const timeline = $('timeline');
const speed = $('speed');
const speedText = $('speedText');
const result = $('result');
const prevSeed = $('prevSeed');
const nextSeed = $('nextSeed');
const redLegend = $('redLegend');
const blueLegend = $('blueLegend');

let data = null;
let index = 0;
let timer = null;
let currentSeed = 0n;

function stop() {
  if (timer !== null) {
    clearInterval(timer);
    timer = null;
  }
  play.textContent = '播放';
}

function updateDepthVisibility() {
  redDepthField.classList.toggle('hidden', redAgent.value !== 'alphabeta');
  blueDepthField.classList.toggle('hidden', blueAgent.value !== 'alphabeta');
}

function renderBoard(text, n) {
  board.replaceChildren();
  board.style.gridTemplateColumns = `repeat(${n},1fr)`;

  for (const value of text) {
    const cell = document.createElement('div');
    cell.className = value === '#' ? 'cell blocked' : 'cell';
    if (value === 'R' || value === 'B') {
      const piece = document.createElement('div');
      piece.className = `piece ${value === 'R' ? 'red' : 'blue'}`;
      cell.appendChild(piece);
    }
    board.appendChild(cell);
  }
}

function render() {
  if (!data) return;
  const frame = data.frames[index];
  renderBoard(frame.board, data.size);
  turnEl.textContent = frame.turn;
  progressText.textContent = `${index} / ${data.frames.length - 1}`;
  redScore.textContent = frame.red;
  blueScore.textContent = frame.blue;
  actor.textContent = frame.turn === 0 ? '開局' : `${frame.player} · ${frame.agent}`;
  moveEl.textContent = frame.move;
  timeline.value = index;
  prev.disabled = index === 0;
  next.disabled = index === data.frames.length - 1;
}

function start() {
  if (!data) return;
  if (index >= data.frames.length - 1) {
    index = 0;
    render();
  }

  stop();
  const delay = Math.max(120, Math.round(900 / Number(speed.value)));
  timer = setInterval(() => {
    if (index >= data.frames.length - 1) {
      stop();
      return;
    }
    index++;
    render();
  }, delay);
  play.textContent = '暫停';
}

function readAgentConfig(type, depthValue) {
  if (!['random', 'greedy', 'alphabeta'].includes(type)) {
    throw new Error('未知的 AI 類型。');
  }
  const depth = Number(depthValue);
  if (type === 'alphabeta' && (!Number.isInteger(depth) || depth < 1 || depth > 4)) {
    throw new Error('Alpha-Beta 深度請輸入 1 到 4 的整數。');
  }
  return {type, depth};
}

function load(seedText, sizeText, densityText, redType, redDepthValue, blueType, blueDepthValue, pushUrl = true) {
  stop();
  errorEl.textContent = '';
  statusEl.textContent = '計算對局中…';

  setTimeout(() => {
    try {
      const seed = BigInt(seedText);
      if (seed < 0n || seed > 18446744073709551615n) {
        throw new Error('Seed 必須是 0 到 18446744073709551615 的整數。');
      }

      const size = Number(sizeText);
      const densityPercent = Number(densityText);
      if (!Number.isInteger(size) || size < 4 || size > 30) {
        throw new Error('棋盤大小請輸入 4 到 30 的整數。');
      }
      if (!Number.isFinite(densityPercent) || densityPercent < 0 || densityPercent > 90) {
        throw new Error('障礙比例請輸入 0 到 90。');
      }

      const redConfig = readAgentConfig(redType, redDepthValue);
      const blueConfig = readAgentConfig(blueType, blueDepthValue);
      currentSeed = seed;

      const density = densityPercent / 100;
      const sim = simulate(size, density, seed, redConfig, blueConfig);
      data = {
        ...sim,
        size,
        density,
        seed,
        redConfig,
        blueConfig
      };

      index = 0;
      timeline.max = data.frames.length - 1;
      matchup.textContent = `${sim.redName}（紅） vs ${sim.blueName}（藍）`;
      meta.textContent = `${size}×${size} · 障礙 ${densityPercent}% (${sim.blocked} 格) · seed ${seed}`;
      redLegend.textContent = `${sim.redName} / Red`;
      blueLegend.textContent = `${sim.blueName} / Blue`;
      result.textContent = `結果：${sim.winner === 'Draw' ? '平手' : sim.winner + ' 獲勝'} · 共 ${data.frames.length - 1} 回合`;
      statusEl.textContent = '對局已完成。';
      render();

      if (pushUrl) {
        const params = new URLSearchParams({
          seed: String(seed),
          size: String(size),
          density: String(densityPercent),
          red: redConfig.type,
          blue: blueConfig.type,
          redDepth: String(redConfig.depth),
          blueDepth: String(blueConfig.depth)
        });
        history.replaceState(null, '', `?${params}`);
      }
    } catch (error) {
      statusEl.textContent = '';
      errorEl.textContent = error.message;
    }
  }, 20);
}

queryForm.addEventListener('submit', event => {
  event.preventDefault();
  load(
    seedInput.value,
    sizeInput.value,
    densityInput.value,
    redAgent.value,
    redDepth.value,
    blueAgent.value,
    blueDepth.value
  );
});

redAgent.addEventListener('change', updateDepthVisibility);
blueAgent.addEventListener('change', updateDepthVisibility);

prev.addEventListener('click', () => {
  stop();
  if (index > 0) index--;
  render();
});

next.addEventListener('click', () => {
  stop();
  if (data && index < data.frames.length - 1) index++;
  render();
});

play.addEventListener('click', () => {
  if (timer === null) start();
  else stop();
});

timeline.addEventListener('input', () => {
  stop();
  index = Number(timeline.value);
  render();
});

speed.addEventListener('input', () => {
  speedText.textContent = `${Number(speed.value).toFixed(2).replace(/0+$/, '').replace(/\.$/, '')}×`;
  if (timer !== null) start();
});

prevSeed.addEventListener('click', () => {
  if (currentSeed > 0n) {
    seedInput.value = String(currentSeed - 1n);
    queryForm.requestSubmit();
  }
});

nextSeed.addEventListener('click', () => {
  if (currentSeed < 18446744073709551615n) {
    seedInput.value = String(currentSeed + 1n);
    queryForm.requestSubmit();
  }
});

const params = new URLSearchParams(location.search);
if (params.has('seed')) seedInput.value = params.get('seed');
if (params.has('size')) sizeInput.value = params.get('size');
if (params.has('density')) densityInput.value = params.get('density');
if (params.has('red')) redAgent.value = params.get('red');
if (params.has('blue')) blueAgent.value = params.get('blue');
if (params.has('redDepth')) redDepth.value = params.get('redDepth');
if (params.has('blueDepth')) blueDepth.value = params.get('blueDepth');

updateDepthVisibility();
load(
  seedInput.value,
  sizeInput.value,
  densityInput.value,
  redAgent.value,
  redDepth.value,
  blueAgent.value,
  blueDepth.value,
  false
);
</script>
</body>
</html>
